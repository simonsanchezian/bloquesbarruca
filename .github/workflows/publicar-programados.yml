# Publicación programada de artículos del blog.
#
# Cada artículo programado vive en una rama `programado/AAAA-MM-DD-nombre`, ya
# revisado y listo. Esta tarea se ejecuta cada mañana y fusiona en master las
# ramas cuya fecha ya ha llegado; Vercel despliega solo al recibir el push.
# Si una fusión choca con cambios hechos en master, la tarea falla y GitHub
# avisa por correo: el artículo no se publica a medias.
name: Publicar artículos programados
on:
  schedule:
    - cron: '0 7 * * *'   # 09:00 en horario de verano peninsular (08:00 en invierno)
  workflow_dispatch:       # para lanzarla a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Fusionar las ramas programadas que ya toca publicar
        run: |
          git config user.name "Publicación programada"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          hoy=$(TZ=Europe/Madrid date +%F)
          echo "Hoy: $hoy"
          for r in $(git branch -r --format='%(refname:short)' | grep '^origin/programado/' || true); do
            rama=${r#origin/}
            fecha=$(echo "$rama" | sed -E 's#^programado/([0-9]{4}-[0-9]{2}-[0-9]{2}).*#\1#')
            [[ "$fecha" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Sin fecha: $rama"; continue; }
            if [[ "$fecha" > "$hoy" ]]; then echo "Aún no: $rama"; continue; fi
            echo "Publicando $rama"
            git merge --no-ff "$r" -m "Publicación programada: $rama"
            git push origin master
            git push origin --delete "$rama"
          done
